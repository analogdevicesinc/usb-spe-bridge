name: Build documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
  pull_request:
    paths:
      - 'docs/**'
    types: [opened, synchronize, reopened, closed]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-doc:
    runs-on: ${{ vars.RUNNER != '' && fromJSON(vars.RUNNER) || 'ubuntu-latest' }}
    if: github.event.action != 'closed'
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Install pip packages
      run: |
        python3 -m venv ~/venv
        source ~/venv/bin/activate
        pip3 install -r docs/requirements.txt --upgrade

    - name: Build doc
      working-directory: docs
      env:
        ADOC_DOC_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
      run: |
        source ~/venv/bin/activate
        make html SPHINXOPTS='-jauto -W --keep-going'

    - name: Store the generated doc
      uses: actions/upload-artifact@v6
      with:
        name: html
        path: docs/_build/html

  deploy-gh-pages:
    runs-on: ubuntu-latest
    needs: build-doc
    permissions:
      contents: write
    if: github.event.action != 'closed'

    steps:
    - uses: analogdevicesinc/doctools/gh-pages-deploy@action
      with:
        name: html
        tag: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
        new_tag: ${{ github.event_name == 'release' && 'true' || 'false' }}

  clean-gh-pages:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    permissions:
      contents: write

    steps:
    - uses: analogdevicesinc/doctools/gh-pages-rm-path@action
      with:
        path: pull/${{ github.event.number }}
